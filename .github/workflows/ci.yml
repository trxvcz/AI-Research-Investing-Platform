name: starter
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo
  backend:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: services/backend/src
      ALPHASENSE_TEST_DATABASE_URL: postgresql+psycopg:///postgres
      ALPHASENSE_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - name: Start isolated runner PostgreSQL for integration tests
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          test -x "$ALPHASENSE_PG_BIN/pg_dump"
          test -x "$ALPHASENSE_PG_BIN/psql"
      - run: python -m pip check
      - run: python -m ruff check services/backend migrations
      - run: python -m ruff format --check services/backend migrations
      - run: python -m mypy
      - run: python -m alphasense.schemas --check
      - run: python scripts/export_panel_openapi.py --check
      - run: npm ci && npm run generate && npm test && npm run build && git diff --exit-code
        working-directory: apps/panel
      - run: python -m pytest

