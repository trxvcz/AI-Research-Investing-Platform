[project]
name = "alphasense-research"
version = "0.1.0"
description = "Research-only validation API; no external providers or execution"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0", "pydantic==2.14.2", "uvicorn==0.54.0",
    "jsonschema[format]==4.26.0", "referencing==0.37.0",
    "SQLAlchemy==2.1.6", "alembic==1.20.1", "psycopg[binary]==3.3.6"
]

[tool.setuptools.packages.find]
where = ["services/backend/src"]

[tool.pytest.ini_options]
testpaths = ["services/backend/tests"]
pythonpath = ["services/backend/src"]
addopts = "-ra"
markers = ["postgres: requires a real PostgreSQL configured via ALPHASENSE_TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/backend/src"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["services/backend/src"]
mypy_path = "services/backend/src"
strict = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
